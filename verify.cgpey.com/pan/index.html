<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAN Verification</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="container">
    <nav class="nav-links" aria-label="Verification pages">
      <a href="../index.html">Home</a>
      <a href="./index.html" class="active">PAN Verification</a>
      <a href="../driving_licence/index.html">Driving Licence</a>
      <a href="../face_match/index.html">Face Match</a>
    </nav>

    <h1>PAN Verification</h1>
    <p class="subtitle">Securely verify PAN via <code>/api/v1/verify/pan</code>.</p>

    <form id="panForm" class="verify-form">
      <label for="panInput">PAN Number</label>
      <input
        id="panInput"
        name="pan"
        type="text"
        placeholder="ABCDE1234F"
        maxlength="10"
        autocomplete="off"
        required
      />
      <button id="verifyBtn" type="submit">Verify PAN</button>
    </form>

    <p id="status" aria-live="polite"></p>
    <pre id="result" aria-live="polite"></pre>
  </main>
  <script src="../script.js"></script>
</body>
</html>
