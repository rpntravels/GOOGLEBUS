<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>verify.cgpey.com</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>PAN Verification</h1>
    <p class="subtitle">Securely verify PAN via <code>/api/v1/verify/pan</code> (pk_9edfc78b6edf287eb5bd143725735cbd,34.227.222.207,54.86.157.86,76.76.21.21)</p>

    <form i="panForm" class="verify-form">
      <label for="panInput">PAN Number</label>
      <input
        id="panInput"
        name="pan"
        type="text"
        placeholder="ABCDE1234F"
        maxlength="10"
        autocomplete="off"
        required
      />
      <button id="verifyBtn" type="submit">Verify PAN</button>
    </form>

    <p id="status" aria-live="polite"></p>
    <pre id="result" aria-live="polite"></pre>
  </main>
  <script src="script.js"></script>
</body>
</html>
