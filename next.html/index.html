<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Event Calendar</h1>
            <button id="adminBtn" class="admin-btn">Admin Login</button>
        </header>

        <div class="calendar-wrapper">
            <div class="calendar-header">
                <button id="prevMonth">&lt;</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth">&gt;</button>
            </div>

            <div class="calendar-grid">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div class="events-section">
            <h3>📝 Events</h3>
            <button id="addEventBtn" class="add-event-btn">+ Add Event</button>
            <div id="eventsList" class="events-list"></div>
        </div>
    </div>

    <!-- Event Form Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Event</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label for="purpose">purpose *</label>
                    <input type="text" id="purpose" required placeholder=" purpose of visit">
                </div>
                
                <div class="form-group">
                    <label for="Name">Name *</label>
                    <input type="text" id="Name" required placeholder="Enter name">
                </div>

                <div class="form-group">
                    <label for="Date">Date *</label>
                    <input type="date" id="Date" required>
                </div>

                <div class="form-group">
                    <label for="Time">Time</label>
                    <input type="time" id="Time" placeholder="Select time">
                </div>

                <div class="form-group">
                    <label for="Address">Address *</label>
                    <input type="text" id="Address" required placeholder="Enter  address">
                </div>

                <div class="form-group">
                    <label for="Phone">Phone Number *</label>
                    <input type="tel" id="Phone" required placeholder="Enter contact phone">
                </div>

                <div class="form-group">
                    <label for="Description">Description</label>
                    <textarea id="Description" rows="4" placeholder="Enterdescription"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Save Event</button>
                    <button type="button" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content admin-modal">
            <span class="close admin-close">&times;</span>
            <h2>🔐 Admin Login</h2>
            <form id="adminForm">
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required placeholder="Enter admin password">
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Login</button>
                    <button type="button" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
